[platformio]
; env:native is test-only (no main()/firmware sources) - build/upload it via
; `pio test -e native`, not `pio run`. Keep it out of the default `pio run`
; sweep so the plain Build task only targets real firmware.
default_envs = meshcore_bare

[env:meshcore_bare]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ================================================================
; DEBUGGING CONFIGURATION (ESP32-S3 Native USB JTAG)
; ================================================================
; To debug using the built-in JTAG (leftmost USB port), uncomment 
; the following lines and the USB_MODE flags in build_flags below:
; build_type = debug
; debug_tool = esp-builtin
; upload_protocol = esp-builtin
; debug_load_cmds = preload

; Standard UART upload (rightmost USB port / UART)
upload_protocol = esptool
monitor_speed = 115200
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
  -DRADIOLIB_STATIC_ONLY=1 -DRADIOLIB_GODMODE=1
  ; Uncomment these if using JTAG debugging to prevent USB PHY reset:
  ; -D ARDUINO_USB_MODE=1
  ; -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ESP32_PLATFORM
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5
  -D ENABLE_ADVERT_ON_BOOT=1
  -D ESP32_CPU_FREQ=240
  -D P_LORA_NSS=7
  -D P_LORA_SCLK=5
  -D P_LORA_MISO=3
  -D P_LORA_MOSI=6
  -D P_LORA_DIO_1=16
  -D P_LORA_BUSY=15
  -D P_LORA_RESET=8
  -D SX126X_USE_REGULATOR_LDO=1
  -D SX126X_RXEN=4
  -D SX126X_TXEN=9
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D MAX_GROUP_CHANNELS=8
  -I src
  -D LORA_SYNC_WORD=18
  -D LORA_TX_POWER=17
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_DIO2_AS_RF_SWITCH=1
  -D BLE_CUSTOM_NAME="\"MeshCore-Bare\""
  -D BLE_CUSTOM_PIN=123456
  -D PUBLIC_CHANNEL_NAME="\"Public\""
  -D PUBLIC_CHANNEL_PSK="\"izOH6cXN6mrJ5e26oRXNcg==\""

lib_ldf_mode = deep+
lib_deps =
  SPI
  Wire
  densaugeo/base64@1.4.0
  https://github.com/meshcore-dev/MeshCore.git#0679dbeffc504d562d2f09eb072fdc223f8ffc2a

; ================================================================
; NATIVE UNIT TESTS (host build, no hardware)
; ================================================================
; Mirrors the mimic-badge-1 native-testing style: hardware-boundary mocks
; live in test/mocks, and each test/test_*/test_main.cpp pulls in the real
; meshcore-bare .cpp implementation(s) under test via #include at the bottom
; of the file. Third-party/vendored MeshCore, Crypto and ed25519 sources are
; each compiled as their own translation unit via thin wrappers under
; test/native_glue (avoids symbol/macro collisions from concatenating many
; unrelated third-party files together).
; Requires .pio/libdeps/meshcore_bare/MeshCore to already be fetched (build
; the meshcore_bare env, or run `pio pkg install`, at least once first).
[env:native]
platform = native
test_framework = unity
build_flags =
  -std=c++17
  -Wall -Wextra -Wpedantic
  -D MAX_GROUP_CHANNELS=8
  -D MAX_CONTACTS=100
  -D UNITY_INCLUDE_DOUBLE
  -D NATIVE_BUILD
  -D RADIO_CLASS=MockRadioModule
  -D WRAPPER_CLASS=MockRadioWrapper
  -I test/mocks
  -I src
  -I .pio/libdeps/meshcore_bare/MeshCore/src
  -I .pio/libdeps/meshcore_bare/Crypto
  -I .pio/libdeps/meshcore_bare/base64/src
  -I .pio/libdeps/meshcore_bare/CayenneLPP/src
  -I .pio/libdeps/meshcore_bare/ArduinoJson
  -I lib/ed25519
lib_extra_dirs = test/native_glue
lib_deps =
  mesh_core
  crypto_glue
  ed25519_glue
build_src_filter = -<*>
